# Builds PDFsharp & MigraDoc with .NET 10 and runs the tests on Linux, macOS, and Windows.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # PdfSharp.BuildConfig computes the version from the git history.

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The tests need fonts, images, and PDF files. The script checks the SHA-256 hash of every file.
      - name: Download test assets
        shell: pwsh
        run: ./dev/download-assets.ps1

      # PdfSharp.BuildConfig generates the version information from the git history.
      # It needs PowerShell, which all runners provide. It does not download anything.
      - name: Create build configuration
        run: dotnet build src/foundation/src/shared/src/PdfSharp.BuildConfig/PdfSharp.BuildConfig.csproj -c Release

      # One code base and one solution: the same steps run on Linux, macOS, and Windows.
      - name: Build
        run: dotnet build PdfSharp.sln -c Release -warnaserror

      - name: Test
        run: dotnet test PdfSharp.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Summarize failed tests
        if: always()
        shell: pwsh
        run: |
          # Lists the failed tests with the first line of their error message, in the log and in the job summary.
          $rows = foreach ($trx in Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$xml = Get-Content -Raw -LiteralPath $trx.FullName
            foreach ($result in @($xml.TestRun.Results.UnitTestResult) | Where-Object { $_.outcome -eq 'Failed' }) {
              $message = ("$($result.Output.ErrorInfo.Message)" -split "`n")[0].Trim()
              "| $($result.testName) | $($message.Replace('|', '/')) |"
            }
          }
          $rows = @($rows | Sort-Object -Unique)
          Write-Output "Failed tests: $($rows.Count)"
          $rows | ForEach-Object { Write-Output "FAILED $_" }
          if ($rows.Count -gt 0) {
            "### Failed tests on ${{ matrix.os }}`n`n| Test | Error |`n|---|---|" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            $rows | Out-File -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
