# Builds PDFsharp & MigraDoc with .NET 10 and runs the tests on Linux, macOS, and Windows.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # PdfSharp.BuildConfig computes the version from the git history.

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # PdfSharp.BuildConfig downloads the assets (fonts, images, PDF files, license assembly)
      # and generates the version information. It needs PowerShell, which all runners provide.
      - name: Download assets and create build configuration
        run: dotnet build src/foundation/src/shared/src/PdfSharp.BuildConfig/PdfSharp.BuildConfig.csproj -c Release

      - name: Build cross-platform projects
        if: runner.os != 'Windows'
        run: dotnet build PdfSharp-Core.slnf -c Release -warnaserror

      - name: Build all projects, including GDI and WPF
        if: runner.os == 'Windows'
        run: dotnet build PdfSharp.sln -c Release -warnaserror

      - name: Test cross-platform projects
        run: dotnet test PdfSharp-Core.slnf -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
