# Keeps NuGet packages (central package management in src/Directory.Packages.props)
# and GitHub Actions up to date.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      tests:
        patterns:
          - "xunit*"
          - "Xunit*"
          - "FluentAssertions"
          - "MSTest*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
